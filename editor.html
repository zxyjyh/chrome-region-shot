<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Region Shot · 标注</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header id="bar">
  <div class="brand" title="Region Shot 标注编辑器">Region Shot<span>标注</span></div>

  <div class="barScroll">
    <div class="group" role="toolbar" aria-label="标注工具">
      <button class="tool is-on" data-tool="text" title="文字（T）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14M10 4v13"/></svg>
        文字
      </button>
      <button class="tool" data-tool="arrow" title="箭头（A）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17 16 4M8 4h8v8"/></svg>
        箭头
      </button>
      <button class="tool" data-tool="rect" title="矩形（R）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="5" width="14" height="10" rx="1"/></svg>
        矩形
      </button>
      <button class="tool" data-tool="select" title="选择并拖动（V）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5 15 9l-4.2 1.1L8.6 14z"/></svg>
        选择
      </button>
    </div>

    <div class="group" id="palette" role="group" aria-label="颜色"></div>

    <div class="group size-group">
      <span class="cap">字号</span>
      <input id="size" type="range" min="16" max="96" step="2" value="32" aria-label="字号">
      <span id="sizeVal" class="val">32</span>
    </div>

    <div class="group">
      <button class="icon" id="undo" title="撤销（⌘Z）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6H4V3M4.6 6.6A6.5 6.5 0 1 1 3.6 12"/></svg>
      </button>
      <button class="icon" id="del" title="删除选中（Delete）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg>
      </button>
    </div>
  </div>

  <div class="actions">
    <button class="btn ghost" id="cancel">取消</button>
    <button class="btn primary" id="save">✓ 保存 PNG</button>
  </div>
</header>

<main id="stageWrap">
  <div id="stage">
    <canvas id="view"></canvas>
    <textarea id="input" spellcheck="false" autocomplete="off"></textarea>
  </div>
</main>

<footer id="status">
  <span id="hint">点击图片任意位置添加文字 · 拖动可调整位置 · Delete 删除 · ⌘Z 撤销</span>
  <span class="zoom">
    <button class="icon sm" id="zoomOut" title="缩小">−</button>
    <span id="zoomVal">100%</span>
    <button class="icon sm" id="zoomIn" title="放大">+</button>
    <button class="btn ghost sm" id="fit">适应宽度</button>
  </span>
</footer>

<script src="editor.js"></script>
</body>
</html>
