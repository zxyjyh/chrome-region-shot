<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Area Screenshot · 标注</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header id="bar">
  <div class="brand" data-i18n-title="brandTitle" title="Area Screenshot 标注编辑器">Area Screenshot<span data-i18n="brandTag">标注</span></div>

  <div class="barScroll">
    <div class="group" role="toolbar" data-i18n-aria="toolsAria" aria-label="标注工具">
      <button class="tool is-on" data-tool="text" data-i18n-title="toolTextTitle" title="文字（T）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14M10 4v13"/></svg>
        <span data-i18n="toolText">文字</span>
      </button>
      <button class="tool" data-tool="arrow" data-i18n-title="toolArrowTitle" title="箭头（A）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17 16 4M8 4h8v8"/></svg>
        <span data-i18n="toolArrow">箭头</span>
      </button>
      <button class="tool" data-tool="rect" data-i18n-title="toolRectTitle" title="矩形（R）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="5" width="14" height="10" rx="1"/></svg>
        <span data-i18n="toolRect">矩形</span>
      </button>
      <button class="tool" data-tool="select" data-i18n-title="toolSelectTitle" title="选择并拖动（V）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5 15 9l-4.2 1.1L8.6 14z"/></svg>
        <span data-i18n="toolSelect">选择</span>
      </button>
    </div>

    <div class="group" id="palette" role="group" data-i18n-aria="paletteAria" aria-label="颜色"></div>

    <div class="group size-group">
      <span class="cap" data-i18n="fontSize">字号</span>
      <input id="size" type="range" min="16" max="96" step="2" value="32" data-i18n-aria="fontSize" aria-label="字号">
      <span id="sizeVal" class="val">32</span>
    </div>

    <div class="group">
      <button class="icon" id="undo" data-i18n-title="undoTitle" title="撤销（⌘Z）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6H4V3M4.6 6.6A6.5 6.5 0 1 1 3.6 12"/></svg>
      </button>
      <button class="icon" id="del" data-i18n-title="delTitle" title="删除选中（Delete）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg>
      </button>
    </div>
  </div>

  <div class="actions">
    <label class="lang" data-i18n-title="langTitle" title="界面语言">
      <span class="langIcon" aria-hidden="true">🌐</span>
      <select id="lang">
        <option value="auto" data-i18n="langAuto">自动</option>
        <option value="zh_CN">简体中文</option>
        <option value="zh_TW">繁體中文</option>
        <option value="en">English</option>
      </select>
    </label>
    <button class="btn ghost" id="cancel" data-i18n="cancel">取消</button>
    <button class="btn" id="copy" data-i18n="copy" data-i18n-title="copyTitle" title="复制到剪贴板，可直接粘贴到微信 / 钉钉">复制图片</button>
    <button class="btn primary" id="save" data-i18n="savePng">✓ 保存 PNG</button>
  </div>
</header>

<main id="stageWrap">
  <div id="stage">
    <canvas id="view"></canvas>
    <textarea id="input" spellcheck="false" autocomplete="off"></textarea>
  </div>
</main>

<footer id="status">
  <span id="hint" data-i18n="hintText">点击图片任意位置添加文字 · 拖动可调整位置 · Delete 删除 · ⌘Z 撤销</span>
  <span class="zoom">
    <button class="icon sm" id="zoomOut" data-i18n-title="zoomOut" title="缩小">−</button>
    <span id="zoomVal">100%</span>
    <button class="icon sm" id="zoomIn" data-i18n-title="zoomIn" title="放大">+</button>
    <button class="btn ghost sm" id="fit" data-i18n="fit">适应宽度</button>
  </span>
</footer>

<script src="i18n.js"></script>
<script src="editor.js"></script>
</body>
</html>
