<!doctype html>
<html><head><meta charset="utf-8"><title>e2e · 横向滚动</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  /* 内容比视口宽也比视口高，横向和纵向都要滚才能看完 */
  #scroller { width: 100vw; height: 100vh; overflow: auto; }
  #grid {
    width: 2000px; height: 2000px;
    display: grid;
    grid-template-columns: repeat(4, 500px);
    grid-template-rows: repeat(4, 500px);
  }
</style></head>
<body>
<div id="scroller"><div id="grid"></div></div>
<script>
  // 4×4 色块网格，行列都错开，用来验证二维拼接有没有接错位置
  const COLORS = [
    ['#ff0000', '#00ff00', '#0000ff', '#ffff00'],
    ['#00ff00', '#0000ff', '#ffff00', '#ff0000'],
    ['#0000ff', '#ffff00', '#ff0000', '#00ff00'],
    ['#ffff00', '#ff0000', '#00ff00', '#0000ff'],
  ];
  const grid = document.getElementById('grid');
  for (const row of COLORS) {
    for (const color of row) {
      const cell = document.createElement('div');
      cell.style.background = color;
      grid.appendChild(cell);
    }
  }
  window.__testScrollTop = () => document.getElementById('scroller').scrollTop;
  window.__testScrollLeft = () => document.getElementById('scroller').scrollLeft;
</script>
</body></html>
